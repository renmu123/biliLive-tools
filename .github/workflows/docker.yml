name: build and push docker

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.service }} image
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: frontend
            image: bililive-tools-frontend
            build-args: ""
          - service: backend
            image: bililive-tools-backend
            build-args: ""
          - service: fullstack
            image: bililive-tools
            build-args: |
              VITE_DEFAULT_SERVER=/api
              VITE_FULLSTACK=true
    with:
      runner: |
        default=ubuntu-24.04
        linux/amd64=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      output: image
      push: true
      file: ./docker/Dockerfile
      target: ${{ matrix.service }}
      platforms: linux/amd64,linux/arm64
      build-args: ${{ matrix.build-args }}
      cache: true
      cache-scope: ${{ matrix.service }}
      cache-mode: max
      job-name-prefix: ${{ matrix.service }}
      meta-images: |
        renmu1234/${{ matrix.image }}
        ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      meta-tags: |
        type=raw,value=latest,enable=${{ github.event_name == 'push' }}
        type=ref,event=tag,enable=${{ github.event_name == 'push' }}
        type=raw,value=test,enable=${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
