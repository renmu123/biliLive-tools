name: Publish to npm

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build base package
        run: pnpm run build:base

      - name: Build Cli package
        run: pnpm run --filter bililive-cli build

      - name: Publish to npm
        shell: bash
        run: pnpm publish --filter=huya-danma-listener --filter douyin-danma-listener --filter bililive-cli --filter @bililive-tools/* --access public --no-git-checks
