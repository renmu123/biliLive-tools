appId: com.electron.biliLiveTools
productName: biliLive-tools
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  buildResources: build
asarUnpack:
  - resources/**
  - node_modules/onnxruntime-node/**
afterPack: build/verify-model.cjs
win:
  # 文件规则统一放在平台配置中，避免额外的 files 匹配器收集构建目录。
  files:
    - "out/**/*"
    - "resources/**/*"
    - "package.json"
    - "LICENSE"
    - "!**/node_modules/onnxruntime-node/bin/napi-v3/*/!(${arch}){,/**/*}"
    - "!**/node_modules/onnxruntime-node/bin/napi-v3/!(win32){,/**/*}"
  executableName: biliLive-tools
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64

nsis:
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  deleteAppDataOnUninstall: true
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${productName}-${version}-${os}-${arch}-portable.${ext}

mac:
  # 文件规则统一放在平台配置中，避免额外的 files 匹配器收集构建目录。
  files:
    - "out/**/*"
    - "resources/**/*"
    - "package.json"
    - "LICENSE"
    - "!**/node_modules/onnxruntime-node/bin/napi-v3/*/!(${arch}){,/**/*}"
    - "!**/node_modules/onnxruntime-node/bin/napi-v3/!(darwin){,/**/*}"
  identity: null
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  target:
    - target: dmg
      arch: arm64
dmg:
  # artifactName: ${name}-${version}.${ext}
linux:
  # 文件规则统一放在平台配置中，避免额外的 files 匹配器收集构建目录。
  files:
    - "out/**/*"
    - "resources/**/*"
    - "package.json"
    - "LICENSE"
    - "!**/node_modules/onnxruntime-node/bin/napi-v3/*/!(${arch}){,/**/*}"
    - "!**/node_modules/onnxruntime-node/bin/napi-v3/!(linux){,/**/*}"
  target:
    # - AppImage
    # - snap
    # - target: snap
    #   arch: x64
    - target: deb
      arch: x64
    - target: zip
      arch: x64
  maintainer: renmu123
  category: Utility
appImage:
  # artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronLanguages:
  - zh-CN
  - en-US
